[project]
name = "harness-discussion"
version = "0.1.1"
description = "Select text anywhere on Windows or macOS and hear it read aloud"
authors = [
    { name = "tzachbon", email = "tzachbonfil@gmail.com" }
]
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiortc>=1.15.0",
    "comtypes>=1.4.17; sys_platform == 'win32'",
    "edge-tts>=7.2.8",
    "faster-whisper==1.2.1",
    "kokoro-onnx==0.6.1",
    "pillow>=12.3.0",
    "pynput>=1.8.2; sys_platform == 'win32'",
    "pyobjc-framework-applicationservices>=11; sys_platform == 'darwin'",
    "pyobjc-framework-avfoundation>=11; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=11; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=11; sys_platform == 'darwin'",
    "pystray>=0.19.5; sys_platform == 'win32'",
    "sounddevice>=0.5.6",
    "truststore>=0.10",
    "uiautomation>=2.0.29; sys_platform == 'win32'",
]

[project.gui-scripts]
harness-discussion = "harness_discussion.__main__:main"

[project.optional-dependencies]
cuda = [
    "nvidia-cuda-nvrtc-cu12==12.9.86; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "nvidia-cublas-cu12==12.8.4.1; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "nvidia-cudnn-cu12==9.3.0.75; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
spike = [
    "aiortc>=1.15.0",
]
